<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Islam's Guide - رفيق التعافي الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap');
      body {
        font-family: 'Tajawal', sans-serif;
        background-color: #020617; /* Slate 950 */
        color: #e2e8f0;
      }
      /* Custom Dark Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a; 
      }
      ::-webkit-scrollbar-thumb {
        background: #334155; 
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569; 
      }

      /* --- Animation Utility Polyfills (mimics tailwindcss-animate) --- */
      .animate-in { animation-duration: 150ms; --tw-enter-opacity: initial; --tw-enter-scale: initial; --tw-enter-rotate: initial; --tw-enter-translate-x: initial; --tw-enter-translate-y: initial; animation-name: enter; }
      .fade-in { --tw-enter-opacity: 0; }
      .zoom-in { --tw-enter-scale: 0.95; }
      
      .slide-in-from-top-1 { --tw-enter-translate-y: -0.25rem; }
      .slide-in-from-top-2 { --tw-enter-translate-y: -0.5rem; }
      .slide-in-from-top-4 { --tw-enter-translate-y: -1rem; }
      .slide-in-from-top-8 { --tw-enter-translate-y: -2rem; }
      
      .slide-in-from-bottom-4 { --tw-enter-translate-y: 1rem; }
      .slide-in-from-bottom-8 { --tw-enter-translate-y: 2rem; }
      .slide-in-from-bottom-12 { --tw-enter-translate-y: 3rem; }
      .slide-in-from-bottom-20 { --tw-enter-translate-y: 5rem; }
      
      .slide-in-from-left-4 { --tw-enter-translate-x: -1rem; }
      .slide-in-from-right-8 { --tw-enter-translate-x: 2rem; }
      
      .duration-300 { animation-duration: 300ms; }
      .duration-500 { animation-duration: 500ms; }
      .duration-700 { animation-duration: 700ms; }
      .duration-1000 { animation-duration: 1000ms; }
      
      .delay-200 { animation-delay: 200ms; }

      @keyframes enter {
        from {
          opacity: var(--tw-enter-opacity, 1);
          transform: translate3d(var(--tw-enter-translate-x, 0), var(--tw-enter-translate-y, 0), 0) scale3d(var(--tw-enter-scale, 1), var(--tw-enter-scale, 1), 1) rotate(var(--tw-enter-rotate, 0));
        }
      }
    </style>

{

  }
}
</script>
