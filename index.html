<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Meta Tags for SEO & Social Sharing -->
    <title>Islam's Guide - رفيق التعافي الذكي</title>
    <meta name="description" content="نظام ذكي للتعافي التدريجي الآمن، مدعوم بالخوارزميات وعلم الأعصاب.">
    <meta name="theme-color" content="#020617">

    <!-- Fonts: Tajawal for Arabic, Inter for English -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">

    <!-- Tailwind CDN (Optional fallback, usually handled by build process) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom Base Styles to ensure dark theme loads immediately -->
    <style>
      body {
        background-color: #020617; /* Slate 950 */
        color: #e2e8f0;
        font-family: 'Tajawal', sans-serif;
        overflow-x: hidden; /* Prevent horizontal scroll on mobile */
      }
      
      /* Scrollbar Styling for Webkit */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a; 
      }
      ::-webkit-scrollbar-thumb {
        background: #334155; 
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569; 
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
